<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>静阅</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<main id="home" class="screen"><header class="home-head"><div class="brand"><span class="logo">阅</span><div><h1>静阅</h1><small>把时间，留给好故事。</small></div></div><button id="homeSettings" class="icon" aria-label="阅读设置">☷</button></header>
<section class="library-intro"><span class="eyebrow">YOUR LITTLE LIBRARY</span><h2 id="homeTitle">我的书库</h2><p id="summary">故事在这里，等你回来。</p></section>
<div class="search"><span>⌕</span><input id="filter" type="search" placeholder="查找书名、作者" aria-label="查找书籍"><button id="clearSearch" class="icon" aria-label="清空搜索">×</button></div>
<div id="bookList" class="book-list"></div><div id="empty" class="empty"><span class="empty-book">▤</span><h3>下一段旅程，从一本书开始</h3><p>导入 TXT、MD、EPUB、DOCX、HTML、FB2<br>书籍和阅读位置保存在这台手机上。</p><button class="primary" id="emptyImport">＋ 导入书籍</button></div>
<nav class="home-nav"><button class="nav-tab selected" id="libraryTab"><b>▤</b>书库</button><button class="import-pill" id="importBooks">＋ 导入书籍</button><button class="nav-tab" id="marksTab"><b>☆</b>书签</button></nav></main>
<main id="reader" class="screen hidden"><header class="reader-head"><button id="backHome" class="icon" aria-label="返回书库">‹</button><div class="reader-title"><strong id="bookTitle"></strong><small id="chapterTitle">继续阅读</small></div><button id="addMark" class="icon" aria-label="添加书签">☆</button><button id="readerSettings" class="icon" aria-label="阅读设置">☷</button></header>
<div id="readingViewport"><article id="content"></article></div>
<footer class="reader-foot"><div class="reading-status"><button id="tocButton" class="text-button">☰ 目录</button><span id="progressText">0%</span><button id="findButton" class="text-button">⌕ 搜索</button></div><div class="progress-track"><span id="progressFill"></span></div><div id="pageControls" class="hidden"><button id="prevPage" aria-label="上一页">‹ 上一页</button><span id="pageLabel"></span><button id="nextPage" aria-label="下一页">下一页 ›</button></div></footer></main>
<div id="overlay" class="hidden"><div id="scrim"></div><section id="sheet" role="dialog" aria-modal="true" aria-label="阅读面板"><button id="sheetDrag" class="sheet-drag-area" type="button" aria-label="下拉或点按关闭面板"><span class="sheet-handle" aria-hidden="true"></span></button><header class="sheet-head"><h2 id="sheetTitle"></h2><button id="closeSheet" class="icon" aria-label="关闭">×</button></header><div id="sheetBody"></div></section></div>
<div id="busy" class="hidden"><div class="busy-card"><span class="spinner"></span><strong id="busyText">正在导入…</strong><small>整理完成后即可离线阅读</small></div></div><div id="toast" role="status"></div>
</body></html>
